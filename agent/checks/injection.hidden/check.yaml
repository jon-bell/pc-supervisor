id: injection.hidden
version: content-hash  # computed by the build from this directory plus the code files below
category: deterministic
depends_on: [injection.policy]
inputs: [extraction.glyphs, render, ocr]
schema: schema.json
grounds: [prompt-injection]
evidence: >-
  Flag with the extracted text, the vectors that saw it, and the page region. Hidden text of any content is a signal; hidden text that addresses an AI reader is evidence for prompt-injection.
affected: >-
  The authors, if legitimate text is judged hidden; the whole review process otherwise.
code:
  - src/main/kotlin/net/jonbell/pcs/agent/checks/Hidden.kt
  - src/main/kotlin/net/jonbell/pcs/agent/checks/InjectionChecks.kt
  - src/main/kotlin/net/jonbell/pcs/agent/checks/AddressedPatterns.kt
  - src/main/kotlin/net/jonbell/pcs/agent/extract/PdfExtractor.kt
  - src/main/kotlin/net/jonbell/pcs/agent/extract/TextNorm.kt
  - src/main/kotlin/net/jonbell/pcs/agent/extract/Render.kt
