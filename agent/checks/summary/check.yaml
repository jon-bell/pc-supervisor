evidence: >-
  Every statement carries a quotation from the paper that the harness finds and anchors; a statement without a verifiable anchor is left out and counted. A view for triage, never a recommendation: the output has no score or verdict field.
affected: >-
  The AC, who reads it to decide where to look; a wrong summary misdirects attention but moves no decision by itself.
