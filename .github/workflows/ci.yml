name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"   # nightly: HotCRP master + scale scenario
  workflow_dispatch:
    inputs:
      hotcrp_ref:
        description: HotCRP commit/branch to test against (default = pinned)
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned HotCRP commit; nightly overrides with master. Keep in sync with
  # hotcrp/Dockerfile's default.
  HOTCRP_REF: ${{ inputs.hotcrp_ref || (github.event_name == 'schedule' && 'master') || '60f693f88b9a0ef9e34b11af957a513f1c122690' }}
  COMPOSE_PROJECT_NAME: pcs-${{ github.run_id }}-${{ github.run_attempt }}
  HOTCRP_PORT: "8080"
  # The runner suite replays every witness trace through the API. At HotCRP's
  # default 5,000 requests per hour it runs for over an hour and then gets 429s;
  # with these limits it takes about two minutes. CI therefore no longer
  # exercises the client's 429 back-off; that needs its own test (PLAN to-do).
  HOTCRP_API_PER_HOUR: "100000"
  HOTCRP_API_PER_MINUTE: "5000"
  # Phase dates for the synthetic conference. Seed scenarios are written
  # relative to these, and PCS_NOW pins the clock so rule output is stable.
  PCS_TZ: America/New_York
  PCS_PHASE_REVIEW_DUE: "2030-02-01T23:59"
  PCS_PHASE_RESPONSE_OPEN: "2030-02-08T00:00"
  PCS_PHASE_RESPONSE_CLOSE: "2030-02-11T23:59"
  PCS_PHASE_DISCUSSION_OPEN: "2030-02-12T00:00"
  PCS_PHASE_DISCUSSION_CLOSE: "2030-03-01T23:59"
  PCS_PHASE_DECISIONS_DUE: "2030-03-03T23:59"
  PCS_NOW: "2030-02-26T12:00"
  PCS_DB_PATH: ${{ github.workspace }}/data/ci.db
  PCS_DB_KEY: ci-only-not-secret
  PCS_ANSWERS: ${{ github.workspace }}/model/answers/synthetic.txt

jobs:
  ci:
    runs-on: ripley-cloud
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The ARC runner image has the docker CLI but not the compose v2 plugin.
      - name: Install docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
              https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          docker compose version

      - name: Start HotCRP harness
        run: scripts/hotcrp-up.sh

      - name: Harness API smoke test
        run: scripts/harness-smoke.sh

      - uses: actions/setup-java@v4
        if: hashFiles('settings.gradle.kts') != ''
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('settings.gradle.kts') != ''

      - name: Lint, unit, property, and model-generated tests
        if: hashFiles('settings.gradle.kts') != ''
        run: ./gradlew check

      - name: Fresh harness, seeded with golden
        if: hashFiles('settings.gradle.kts') != ''
        run: |
          docker compose -f hotcrp/compose.yaml down -v --remove-orphans
          scripts/hotcrp-up.sh
          set -a && . ./.env.test && set +a && ./gradlew :seed:run --args=golden

      - name: Contract + integration tests (against harness)
        if: hashFiles('settings.gradle.kts') != ''
        run: set -a && . ./.env.test && set +a && ./gradlew integrationTest

      # The scenario runner's evidence records (PLAN M3a, §A6): the model, not the Kotlin test code, decides
      # whether each recorded run agrees with the specification, and whether each binding control did its job.
      - name: Install elan
        if: hashFiles('runner/build.gradle.kts') != ''
        run: |
          if ! command -v lake >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Re-derive every verdict from the evidence records
        if: hashFiles('runner/build.gradle.kts') != ''
        working-directory: model
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
          lake exe check-evidence ../runner/build/evidence

      - name: Fresh harness for the UI tests (the integration tests change golden)
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          # COMPOSE_PROJECT_NAME (job env) names this run's harness; a fixed -p
          # here would miss it and leave the integration tests' database behind.
          docker compose -f hotcrp/compose.yaml down -v --remove-orphans
          scripts/hotcrp-up.sh
          set -a && . ./.env.test && set +a && ./gradlew :seed:run --args=golden

      - name: Install xvfb
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo -n apt-get update -q && sudo -n apt-get install -y -q xvfb
          fi
          command -v xvfb-run

      - name: UI tests (Compose, against seeded golden)
        if: hashFiles('app/build.gradle.kts') != ''
        run: set -a && . ./.env.test && set +a && xvfb-run -a ./gradlew uiTest

      - name: Upload screenshots to Argos
        if: hashFiles('settings.gradle.kts') != '' && hashFiles('app/build/screenshots/**') != ''
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: npx --yes @argos-ci/cli upload app/build/screenshots

      - name: Scale scenario (nightly only)
        if: github.event_name == 'schedule' && hashFiles('settings.gradle.kts') != ''
        run: set -a && . ./.env.test && set +a && ./gradlew scaleTest

      - name: Collect harness logs
        if: failure()
        run: docker compose -f hotcrp/compose.yaml logs --no-color > hotcrp-logs.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts
          path: |
            hotcrp-logs.txt
            '**/build/reports/'
            runner/build/evidence/
            '**/build/test-results/' 
          if-no-files-found: ignore

      - name: Tear down harness
        if: always()
        run: docker compose -f hotcrp/compose.yaml down -v --remove-orphans || true

  model:
    runs-on: ripley-cloud
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs and the committed report
        working-directory: model
        run: |
          lake build
          lake exe report answers/synthetic.txt > /tmp/model-report.txt
          diff -u model-report.txt /tmp/model-report.txt
          lake exe export export
          lake exe oracle corpus mayRemove 2000 1 > export/oracle-mayRemove.jsonl
          for r in composition owes earlyReject caseMayOpen caseListing eligible compliance pattern overCap; do lake exe oracle corpus $r 1500 2 > export/oracle-$r.jsonl; done
          lake exe oracle corpus minCostMaxFlow 300 3 > export/oracle-mcmf.jsonl
          git diff --exit-code -- export
